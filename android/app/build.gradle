plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    // ★★★ 3차 푸시 — FCM google-services plugin (placeholder 모드)
    // android/app/google-services.json 을 읽어 Firebase 설정을 빌드에 주입한다.
    // placeholder json 도 같은 형식이라 빌드 성공. 사장님이 진짜 파일로
    // 교체만 하면 즉시 활성화.
    id "com.google.gms.google-services"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) { flutterVersionCode = '1' }

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) { flutterVersionName = '1.0' }

android {
    namespace "com.eggplant.market"
    compileSdk 36
    // 일부 플러그인(flutter_secure_storage, flutter_webrtc 등)이 27.0.12077973 을 요구.
    // 가장 높은 버전을 못 박아 두면 plugin 들이 모두 호환된다.
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // flutter_local_notifications 가 core library desugaring 을 요구.
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.eggplant.market"
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            // Optional: configure your own keystore for production release
            // Falls back to debug key if not configured
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // flutter_local_notifications 17.x 가 요구하는 core library desugaring runtime.
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    // ============================================================
    // ★ v1.0.142 (Phase 6 핫픽스 — compileReleaseKotlin 실패 복구)
    //
    //   QRChat v4.0.270 native call 코드를 포팅하면서 EggplantFirebaseMessagingService
    //   가 io.flutter.plugins.firebase.messaging.FlutterFirebaseMessagingService 를
    //   extend 했는데, firebase_messaging 15.1.3 plugin 의 internal class 만으로는
    //   Kotlin compileReleaseKotlin 이 supertype FirebaseMessagingService 를 resolve
    //   하지 못해 컴파일 실패.
    //
    //   해결: QRChat build.gradle.kts (v4.0.270) 와 동일한 dependency 명시 추가.
    //     - firebase-bom 33.7.0   : 모든 Firebase 의존성 버전을 한번에 통제
    //     - firebase-messaging    : FirebaseMessagingService class resolve
    //     - io.agora.rtc full-sdk : AgoraCallManager / AgoraCallActivity 컴파일
    //     - kotlinx-coroutines    : AgoraTokenService 비동기 토큰 발급
    //   Firestore 는 Eggplant 미사용 (Cloudflare Workers + D1 기반) 이라 제외.
    //
    //   Firebase 미설정 (placeholder google-services.json) 환경에서도 JAR 만 포함되고
    //   런타임 init 만 silent skip 되므로 빌드/설치 무영향.
    // ============================================================
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'io.agora.rtc:full-sdk:4.5.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
}
