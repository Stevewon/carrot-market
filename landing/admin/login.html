<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Eggplant 어드민 로그인</title>
  <link rel="stylesheet" href="admin.css?v=v2" />
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <div class="brand">
        🍆 Eggplant Admin
        <small>운영자 전용 콘솔</small>
      </div>
      <div class="err" id="err"></div>
      <form id="login-form" autocomplete="off">
        <div class="form-row">
          <label for="username">아이디</label>
          <input type="text" id="username" name="username" required autocomplete="username" />
        </div>
        <div class="form-row">
          <label for="password">비밀번호</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" id="submit-btn">로그인</button>
      </form>
      <div class="footer-note">
        외부 접근은 감사 로그에 기록됩니다.<br />
        © Quantarium Co., Ltd.
      </div>
    </div>
  </div>

  <!-- 비밀번호 변경 모달 (must_change_pw=1 인 경우 자동 표시) -->
  <div class="modal-backdrop" id="change-pw-modal">
    <div class="modal">
      <h2>비밀번호 변경 (필수)</h2>
      <p style="color:#6b7280; font-size: 13px; margin-bottom: 16px;">
        보안상 첫 로그인 시 새 비밀번호로 변경해주세요. (8~64자)
      </p>
      <div class="err" id="cpw-err"></div>
      <div class="form-row">
        <label for="new-pw">새 비밀번호</label>
        <input type="password" id="new-pw" required minlength="8" maxlength="64" />
      </div>
      <div class="form-row">
        <label for="new-pw-confirm">새 비밀번호 확인</label>
        <input type="password" id="new-pw-confirm" required minlength="8" maxlength="64" />
      </div>
      <div class="actions">
        <button type="button" class="btn-secondary" id="cpw-cancel">취소(로그아웃)</button>
        <button type="button" id="cpw-submit">변경하고 시작</button>
      </div>
    </div>
  </div>

  <script src="admin.js?v=v2"></script>
  <script>
    (function () {
      const errEl = document.getElementById('err');
      const form = document.getElementById('login-form');
      const submitBtn = document.getElementById('submit-btn');

      function showError(msg) {
        errEl.textContent = msg;
        errEl.classList.add('show');
      }
      function clearError() {
        errEl.classList.remove('show');
        errEl.textContent = '';
      }

      // 이미 로그인 상태면 대시보드로
      if (AdminApp.getToken()) {
        // 토큰 유효성 가벼운 체크
        AdminApp.api('/api/admin/me')
          .then(() => { location.href = '/admin/index.html'; })
          .catch(() => { AdminApp.clearToken(); });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearError();
        submitBtn.disabled = true;
        submitBtn.textContent = '로그인 중...';

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        try {
          const res = await AdminApp.api('/api/admin/login', {
            method: 'POST',
            body: { username, password },
          });
          AdminApp.setToken(res.token);
          AdminApp.setAdminInfo(res.admin);
          if (res.must_change_pw) {
            AdminApp.openModal('change-pw-modal');
          } else {
            location.href = '/admin/index.html';
          }
        } catch (err) {
          showError(err.message || '로그인 실패');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = '로그인';
        }
      });

      // 비밀번호 변경 모달
      document.getElementById('cpw-cancel').addEventListener('click', () => {
        AdminApp.clearToken();
        AdminApp.closeModal('change-pw-modal');
        location.reload();
      });
      document.getElementById('cpw-submit').addEventListener('click', async () => {
        const cpwErr = document.getElementById('cpw-err');
        cpwErr.classList.remove('show');
        const newPw = document.getElementById('new-pw').value;
        const confirmPw = document.getElementById('new-pw-confirm').value;
        const oldPw = document.getElementById('password').value;

        if (newPw !== confirmPw) {
          cpwErr.textContent = '두 비밀번호가 일치하지 않아요';
          cpwErr.classList.add('show');
          return;
        }
        if (newPw.length < 8 || newPw.length > 64) {
          cpwErr.textContent = '8~64자 사이로 입력해주세요';
          cpwErr.classList.add('show');
          return;
        }
        try {
          await AdminApp.api('/api/admin/change-password', {
            method: 'POST',
            body: { old: oldPw, new: newPw },
          });
          location.href = '/admin/index.html';
        } catch (err) {
          cpwErr.textContent = err.message || '변경 실패';
          cpwErr.classList.add('show');
        }
      });
    })();
  </script>
</body>
</html>
